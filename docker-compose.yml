# Score Splitter: paste this into Arcane (or run `docker compose up -d`).
# Replace OWNER with the GitHub account that publishes the image.
services:
  score-splitter:
    image: ghcr.io/OWNER/score-splitter:latest
    container_name: score-splitter
    restart: unless-stopped
    ports:
      - "3210:3000"
    environment:
      # Largest upload accepted, in megabytes.
      MAX_UPLOAD_MB: "500"
      # Uploads and their results are deleted after this many hours.
      JOB_TTL_HOURS: "24"
      # Pages read at the same time. Raise it on a machine with more cores.
      OCR_CONCURRENCY: "2"
    volumes:
      - score-splitter-data:/data

volumes:
  score-splitter-data:
